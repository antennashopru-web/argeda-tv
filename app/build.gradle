plugins {
    id 'com.android.application'
}

// Ключ подписи хранится вне репозитория: keystore.properties (storeFile, storePassword, keyAlias, keyPassword).
// Без него release собирается неподписанным.
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace 'ru.argeda.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.argeda.tv'
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def media3 = '1.6.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
