name: Сборка APK

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Ключ подписи берётся из секретов репозитория (Settings → Secrets → Actions):
      # KEYSTORE_BASE64 (файл .jks в base64), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      # Без них собирается только отладочная версия.
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/argeda.jks"
            {
              echo "storeFile=$RUNNER_TEMP/argeda.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi

      - name: Сборка
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then ./gradlew --no-daemon assembleDebug assembleRelease; else ./gradlew --no-daemon assembleDebug; fi

      - uses: actions/upload-artifact@v4
        with:
          name: argeda-tv-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Удаление ключа
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/argeda.jks"
