name: Сборка APK

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Номер версии растёт с каждой сборкой: по нему приложение понимает, что вышло обновление.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Ключ подписи берётся из секретов репозитория (Settings → Secrets and variables → Actions):
      # KEYSTORE_BASE64 (файл .jks в base64), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      # Обновления ставятся поверх только при одном и том же ключе, поэтому без секретов релиз не выпускается.
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/argeda.jks"
            {
              echo "storeFile=$RUNNER_TEMP/argeda.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi

      - name: Сборка
        run: |
          chmod +x gradlew
          V="-PversionCode=$((100 + VERSION_CODE)) -PversionName=$VERSION_NAME"
          if [ "$SIGNED" = "1" ]; then
            ./gradlew --no-daemon $V assembleDebug assembleRelease
          else
            ./gradlew --no-daemon $V assembleDebug
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: argeda-tv-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Каждый push в main с ключом подписи выпускает релиз; приложения на устройствах находят его сами.
      - name: Релиз для автообновления
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$((100 + VERSION_CODE))
          cp app/build/outputs/apk/release/app-release.apk "argeda-tv-$CODE.apk"
          # Зрителю — одна понятная строка: «Что нового: …» из описания PR, иначе заголовок без «(#N)».
          MSG="$(git log -1 --pretty=%B)"
          NOTES="$(printf '%s\n' "$MSG" | sed -nE 's/^[[:space:]]*(Что|что) нового:[[:space:]]*//p' | head -n1)"
          [ -n "$NOTES" ] || NOTES="$(git log -1 --pretty=%s | sed -E 's/[[:space:]]*\(#[0-9]+\)[[:space:]]*$//')"
          gh release create "v$VERSION_NAME" "argeda-tv-$CODE.apk" \
            --title "ARGEDA TV $VERSION_NAME" \
            --notes "$NOTES"
          echo "NOTES<<EOF_NOTES" >> "$GITHUB_ENV"; printf '%s\n' "$NOTES" >> "$GITHUB_ENV"; echo "EOF_NOTES" >> "$GITHUB_ENV"

      # Запасная копия APK в ветке update (raw.githubusercontent.com): приложение качает её,
      # если сервер релизов GitHub отвечает ошибкой. В ветке всегда один коммит: APK с номером, он же под постоянным именем argeda-tv.apk и latest.json.
      - name: Запасная копия для автообновления
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNED == '1'
        continue-on-error: true
        run: |
          CODE=$((100 + VERSION_CODE))
          D="$RUNNER_TEMP/update"
          mkdir -p "$D" && cp "argeda-tv-$CODE.apk" "$D/" && cp "argeda-tv-$CODE.apk" "$D/argeda-tv.apk"
          # latest.json — сведения о версии на случай, если api.github.com у пользователя не открывается.
          jq -n --argjson code "$CODE" --arg tag "v$VERSION_NAME" --argjson size "$(stat -c %s "argeda-tv-$CODE.apk")" \
            --arg notes "$NOTES" '{code:$code, tag:$tag, size:$size, notes:$notes}' > "$D/latest.json"
          cd "$D"
          git init -q -b update
          # argeda-tv.apk — постоянная ссылка для ручной установки, всегда последняя версия.
          git add "argeda-tv-$CODE.apk" argeda-tv.apk latest.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "ARGEDA TV $VERSION_NAME (код $CODE)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" update
          # jsDelivr кэширует ветку: сбрасываем кэш, чтобы через CDN сразу была видна новая версия.
          for f in latest.json argeda-tv.apk "argeda-tv-$CODE.apk"; do
            curl -fsS -m 30 "https://purge.jsdelivr.net/gh/${{ github.repository }}@update/$f" > /dev/null || echo "::warning::jsDelivr purge $f не удался"
          done

      - name: Нет ключа подписи
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNED != '1'
        run: echo "::warning::Секреты KEYSTORE_* не заданы — релиз для автообновления не выпущен."

      - name: Удаление ключа
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/argeda.jks"
