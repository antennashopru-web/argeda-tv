# Временный: забирает музыкальное вступление из ElevenLabs (из облачной среды хост недоступен).
name: Звук заставки
on:
  push:
    branches: ['claude/project-thread-awe1ca']
    paths: ['.github/workflows/fetch-voice.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tools/sound
          curl -fsSL -o tools/sound/sting_1.mp3 "https://elevenlabsusercontent.com/database/workspace/353af677959448bd9d9390943da9a8ba/content_generation/nyGy2jMuR0YhJNqjrZP4/p47Przbh2Gzq8yKvO7Ni/content.mp3?Expires=1794139200&KeyName=assets-cdn-key-1&Signature=XrW94Kt7-sADAaYLCJFTpUfNeeE="
          curl -fsSL -o tools/sound/sting_2.mp3 "https://elevenlabsusercontent.com/database/workspace/353af677959448bd9d9390943da9a8ba/content_generation/XZxe2m9S0GTILQGZQDdx/weFQe3BNxPeDpCHtGD84/content.mp3?Expires=1794139200&KeyName=assets-cdn-key-1&Signature=JUwcd3CRgZJsrsfxAq0jF2M9C9U="
          ls -la tools/sound
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sound
          git commit -m "Музыкальное вступление заставки (ElevenLabs)"
          git push
