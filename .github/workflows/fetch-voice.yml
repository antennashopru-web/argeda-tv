# Временный: забирает голос «Библия — Бог» из ElevenLabs (из облачной среды хост недоступен).
name: Звук заставки
on:
  push:
    branches: ['claude/project-thread-awe1ca']
    paths: ['.github/workflows/fetch-voice.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd tools/sound/v
          curl -fsSL -o god_1.mp3 "https://elevenlabsusercontent.com/database/workspace/353af677959448bd9d9390943da9a8ba/content_generation/52nXZw6DLxFwoK9AElLx/ovivI9qehOg5ksXxgTV5/content.mp3?Expires=1794142800&KeyName=assets-cdn-key-1&Signature=MMsQI2jtbLOZsOQdUqz9YbN8uj4="
          curl -fsSL -o god_2.mp3 "https://elevenlabsusercontent.com/database/workspace/353af677959448bd9d9390943da9a8ba/content_generation/5yaTMXUHrlnPEH5Gy5Q8/Tc2tr7kILRWkDuynhm49/content.mp3?Expires=1794142800&KeyName=assets-cdn-key-1&Signature=ClLeAdwYSyRKOT6E6hQQuUuP2yw="
          ls -la
          cd ../../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sound/v
          git commit -m "Голос «Библия — Бог» для заставки (ElevenLabs)"
          git push
